<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="700" fill="#fbfbfd"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#222">CSG Construction Tree — “BODMAS” = node nesting</text>
  <text x="40" y="72" font-size="14" fill="#666">Brackets are structural: the tree shape IS the order of operations. No precedence rules needed.</text>

  <!-- Flat chain vs bracketed -->
  <rect x="40" y="92" width="900" height="64" rx="8" fill="#fff" stroke="#e2e2ea"/>
  <text x="56" y="118" font-size="13" fill="#888">flat chain (today, left-associative):</text>
  <text x="300" y="118" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#cc2222">return L.subtract(h1).subtract(h2).add(ball)</text>
  <text x="56" y="142" font-size="13" fill="#888">explicit brackets (the tree):</text>
  <text x="300" y="142" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#1592a6">warpSpline( ((L − h1) − h2) ∪ ball )</text>

  <!-- Edges (drawn first so nodes sit on top) -->
  <g stroke="#b8b8c4" stroke-width="2" fill="none">
    <path d="M480,214 L480,256"/>            <!-- warp -> union -->
    <path d="M480,300 L330,352"/>            <!-- union -> subtract -->
    <path d="M480,300 L700,352"/>            <!-- union -> ball -->
    <path d="M330,396 L185,470"/>            <!-- subtract -> L -->
    <path d="M330,396 L330,470"/>            <!-- subtract -> h1 -->
    <path d="M330,396 L475,470"/>            <!-- subtract -> h2 -->
  </g>

  <!-- TRANSFORM node: warpSpline (the "end" transform) -->
  <rect x="390" y="170" width="180" height="44" rx="22" fill="#efe7ff" stroke="#7c4dff" stroke-width="2"/>
  <text x="480" y="197" font-size="15" font-weight="700" fill="#5b2bd6" text-anchor="middle">⟿ warpSpline</text>

  <!-- CSG op: union -->
  <rect x="408" y="256" width="144" height="44" rx="10" fill="#e6f6f9" stroke="#1592a6" stroke-width="2"/>
  <text x="480" y="283" font-size="15" font-weight="700" fill="#0f7080" text-anchor="middle">∪  union</text>

  <!-- CSG op: subtract -->
  <rect x="252" y="352" width="156" height="44" rx="10" fill="#e6f6f9" stroke="#1592a6" stroke-width="2"/>
  <text x="330" y="379" font-size="15" font-weight="700" fill="#0f7080" text-anchor="middle">−  subtract</text>

  <!-- Leaf: ball -->
  <rect x="640" y="352" width="120" height="44" rx="8" fill="#fdeaea" stroke="#cc2222" stroke-width="2"/>
  <text x="700" y="379" font-size="14" font-weight="700" fill="#cc2222" text-anchor="middle">ball</text>
  <text x="700" y="416" font-size="11" fill="#999" text-anchor="middle">r_ball</text>

  <!-- Leaves: L, h1, h2 -->
  <rect x="125" y="470" width="120" height="44" rx="8" fill="#fdeaea" stroke="#cc2222" stroke-width="2"/>
  <text x="185" y="497" font-size="14" font-weight="700" fill="#cc2222" text-anchor="middle">L</text>
  <text x="185" y="534" font-size="11" fill="#999" text-anchor="middle">r_extrude</text>

  <rect x="270" y="470" width="120" height="44" rx="8" fill="#fdeaea" stroke="#cc2222" stroke-width="2"/>
  <text x="330" y="497" font-size="14" font-weight="700" fill="#cc2222" text-anchor="middle">h1</text>
  <text x="330" y="534" font-size="11" fill="#999" text-anchor="middle">r_cylinder</text>

  <rect x="415" y="470" width="120" height="44" rx="8" fill="#fdeaea" stroke="#cc2222" stroke-width="2"/>
  <text x="475" y="497" font-size="14" font-weight="700" fill="#cc2222" text-anchor="middle">h2</text>
  <text x="475" y="534" font-size="11" fill="#999" text-anchor="middle">r_cylinder</text>

  <!-- Callout annotations -->
  <text x="600" y="180" font-size="12.5" fill="#5b2bd6">transform wraps the WHOLE result</text>
  <text x="600" y="198" font-size="12.5" fill="#5b2bd6">→ “warp at the end” (Manifold.warp)</text>

  <text x="560" y="270" font-size="12.5" fill="#0f7080">each op node = one set of brackets</text>

  <!-- BODMAS mapping table -->
  <rect x="600" y="430" width="340" height="210" rx="10" fill="#fff" stroke="#e2e2ea"/>
  <text x="620" y="458" font-size="15" font-weight="700" fill="#333">BODMAS → tree mapping</text>
  <line x1="620" y1="468" x2="920" y2="468" stroke="#eee"/>
  <text x="620" y="492" font-size="13" fill="#444"><tspan font-weight="700">B</tspan>rackets</text>
  <text x="780" y="492" font-size="13" fill="#0f7080">= node nesting (free, unambiguous)</text>
  <text x="620" y="518" font-size="13" fill="#444"><tspan font-weight="700">O</tspan>rders</text>
  <text x="780" y="518" font-size="13" fill="#999">— n/a for CSG</text>
  <text x="620" y="544" font-size="13" fill="#444">ops</text>
  <text x="780" y="544" font-size="13" fill="#0f7080">∪ union · − subtract · ∩ intersect</text>
  <text x="620" y="570" font-size="13" fill="#444">transforms</text>
  <text x="780" y="570" font-size="13" fill="#5b2bd6">unary wrapper nodes</text>
  <text x="780" y="588" font-size="13" fill="#5b2bd6">translate · rotate · warpSpline</text>
  <text x="620" y="616" font-size="12" fill="#888">Evaluation = post-order: build leaves,</text>
  <text x="620" y="632" font-size="12" fill="#888">apply each op/transform up the tree.</text>

  <!-- Legend -->
  <g font-size="12" fill="#555">
    <rect x="40" y="612" width="16" height="16" rx="4" fill="#efe7ff" stroke="#7c4dff"/>
    <text x="62" y="625">transform node</text>
    <rect x="180" y="612" width="16" height="16" rx="3" fill="#e6f6f9" stroke="#1592a6"/>
    <text x="202" y="625">CSG op node</text>
    <rect x="310" y="612" width="16" height="16" rx="3" fill="#fdeaea" stroke="#cc2222"/>
    <text x="332" y="625">primitive leaf</text>
  </g>
</svg>
